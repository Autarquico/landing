name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Ping IndexNow (Bing/Yandex → ChatGPT)
        env:
          INDEXNOW_KEY: 7ab7a4f36c7fc9045a42585c7e7b9071
        run: |
          sleep 15
          urls=$(curl -s https://autarqui.co/sitemap.xml | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g')
          if [ -z "$urls" ]; then echo "IndexNow: no URLs found, skipping"; exit 0; fi
          payload=$(printf '%s\n' "$urls" | jq -R . | jq -s \
            "{host:\"autarqui.co\",key:\"$INDEXNOW_KEY\",keyLocation:\"https://autarqui.co/$INDEXNOW_KEY.txt\",urlList:.}")
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json" -d "$payload" \
            -o /dev/null -w "IndexNow HTTP %{http_code}\n" || true
